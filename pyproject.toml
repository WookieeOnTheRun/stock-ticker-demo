[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stockapp"
version = "0.1.0"
description = "Streamlit app that computes fractional Kelly allocations from historical daily returns."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.66,<2",
    "yfinance>=1.7,<2",
    "pandas>=3.0,<4",
    "numpy>=2.5,<3",
    "plotly>=7.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
    "hypothesis>=6.170,<7",
    "pip-tools>=7.6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
